<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TID - Notre histoire</title>
    <style>
        :root {
            --blue: #4A90E2;
            --teal: #1ABC9C;
            --slate: #334155;
            --dark: #0B2236;
            --bg: #F3FAF8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Manrope', 'Segoe UI', sans-serif;
            color: var(--dark);
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.12), rgba(26, 188, 156, 0.12));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        main {
            width: min(92%, 520px);
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(51, 65, 85, 0.12);
            border-radius: 18px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 45px rgba(15, 23, 42, 0.08);
            backdrop-filter: blur(16px);
        }

        h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            margin-bottom: 1.2rem;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--slate);
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.6rem;
            border-radius: 999px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a:first-of-type {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 12px 24px rgba(74, 144, 226, 0.24);
        }

        a:first-of-type:hover,
        a:first-of-type:focus {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(74, 144, 226, 0.28);
        }

        a:last-of-type {
            background: #fff;
            color: var(--teal);
            border: 1px solid rgba(26, 188, 156, 0.35);
        }

        a:last-of-type:hover,
        a:last-of-type:focus {
            transform: translateY(-2px);
            border-color: rgba(26, 188, 156, 0.55);
        }
    </style>
</head>
<body>
    <main>
        <h1>Page en construction</h1>
        <p>Nous travaillons actuellement sur cette section pour partager notre histoire en detail. Revenez bientot pour decouvrir la suite.</p>
        <div class="actions">
            <a href="landing.html">Retour a la page principale</a>
            <a href="index.html#contact">Contactez-nous</a>
        </div>
    </main>
</body>
</html>
