<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; font-family: "Manrope", "Segoe UI", sans-serif; }
        .page {
            position: relative;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .full-image {
            max-width: 92vw;
            max-height: 90vh;
            width: 110%;
            height: 110%;
            object-fit: contain;
        }
        .back-button {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 0.65rem 1.1rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.9);
            color: #0B2236;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .back-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.2);
        }
        .back-button:focus-visible {
            outline: 2px solid #4A90E2;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main class="page">
        <img class="full-image" src="image/PPE.png" alt="PPE">
        <a class="back-button" href="index.html" aria-label="Retour vers l'accueil">Retour</a>
    </main>
</body>
</html>
